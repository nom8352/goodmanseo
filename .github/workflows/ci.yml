name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check generated pages
        run: |
          test -f dist/index.html
          test -f dist/pricing/index.html
          test -f dist/contact/index.html
          test -f dist/ai-course/index.html
          test -f dist/ai-report/index.html
          test -f dist/en/index.html
          grep -q "AI 실전 코칭 · 홈페이지 · 온라인 마케팅" dist/index.html
